name: Bug report
description: Report reproducible unexpected behavior
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or security vulnerability details. Use private security reporting for vulnerabilities."
  - type: input
    id: environment
    attributes:
      label: "Environment and commit"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected and actual behavior"
    validations:
      required: true
