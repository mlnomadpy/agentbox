name: Feature proposal
description: Discuss a focused improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or security vulnerability details. Use private security reporting for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: "Problem and affected workflow"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior and alternatives"
    validations:
      required: true
